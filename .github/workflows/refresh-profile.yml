name: refresh profile stats

on:
  schedule:
    - cron: "17 5 * * *"   # once nightly; deliberately no push trigger — this job commits
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest contribution stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py assets/stats.json

      - name: Recompose hero card
        run: python3 scripts/compose_hero.py assets/portrait.rows.json assets/stats.json assets/links.json assets/hero.svg

      - name: Commit if changed
        run: |
          FILES="assets/stats.json assets/hero.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
